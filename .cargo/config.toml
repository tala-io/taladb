[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"
# getrandom v0.3+ requires both the `wasm_js` feature AND this cfg flag
# to select the JS backend on wasm32-unknown-unknown.
#
# `+simd128` must live in this array, not in a `RUSTFLAGS` environment variable:
# `RUSTFLAGS` *replaces* this list rather than merging with it, so setting the
# feature that way silently drops the `getrandom_backend` cfg above and the
# build fails inside `getrandom` with no mention of SIMD.
#
# The scoring reductions in `taladb-core::vector` are lane-split so LLVM can
# vectorise them, but the wasm baseline has no vector instructions — without
# this feature they compile scalar and the browser gets none of the benefit the
# native targets get for free. Enabling it makes the module require WASM SIMD,
# which sets the browser floor at Safari 16.4 / Chrome 91 / Firefox 89; see the
# support table in `docs/guide/web.md`.
rustflags = ['--cfg', 'getrandom_backend="wasm_js"', '-C', 'target-feature=+simd128']

[alias]
# `--release`, not `--profile release-wasm`: that profile was deliberately removed
# (see the NOTE in the root Cargo.toml — wasm-pack cannot be pointed at a custom
# profile, so a size-tuned one would silently never run). The alias kept naming it
# and had been failing with "profile `release-wasm` is not defined" ever since.
#
# `-p taladb-web` because that is the only crate meant to reach wasm. Unscoped, the
# alias also tried to build the CLI and node bindings for wasm32, which fails in
# their transitive `getrandom` copies — those crates never select a wasm backend
# because they are never meant to be built this way.
#
# This is a quick local check that the wasm target still compiles. It is not what
# ships: `wasm-pack build packages/bindings/web --target web --release` is, and
# only that applies the `wasm-opt` flags from the web crate's manifest.
wasm = "build -p taladb-web --target wasm32-unknown-unknown --release"
