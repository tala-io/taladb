# cbindgen configuration for taladb-ffi.
# Run: scripts/gen-header.sh  (writes include/taladb.h and the React Native copy)
# (or `pnpm --filter @taladb/react-native build:cbindgen`)

language = "C"
include_guard = "TALADB_FFI_H"
pragma_once = true

# The header is included from C++ (the React Native TalaDBHostObject.cpp,
# TalaDBJni.cpp and iOS TalaDB.mm) as well as from C, Swift and the Kotlin JNI
# shim, but every symbol is plain C. Without this, cbindgen emits no
# `extern "C"` block and every call fails to link against the Rust staticlib
# under C++ name mangling.
cpp_compat = true

# `stdint.h`/`stdlib.h` come from cbindgen's own sys-include logic; listing them
# in `after_includes` as well emits each twice.
after_includes = ""

# Prepended verbatim. Lives here rather than in the .h so that regenerating the
# header cannot silently drop it — the per-function documentation below is
# generated from the doc comments in src/lib.rs.
header = """
/*
 * TalaDB C FFI header.
 *
 * GENERATED FILE — do not edit. Regenerate with:
 *   packages/bindings/ffi/scripts/gen-header.sh
 * CI fails if this file and packages/bindings/ffi/src/lib.rs disagree.
 *
 * This is the stable C interface of the Rust taladb-ffi crate. Its consumers
 * are the React Native JSI HostObject and TurboModule in this repository and
 * the native Swift (taladb/taladb-swift) and Kotlin (taladb/taladb-kotlin)
 * packages, which ship as separate repositories.
 *
 * Compatibility
 * -------------
 *  TALADB_FFI_ABI_VERSION changes whenever a signature in this file changes
 *  incompatibly. A wrapper compiled against this header must check that
 *  taladb_ffi_abi_version() returns the same value before calling anything
 *  else; a mismatch means the library and header came from different releases.
 *
 * Ownership rules
 * ---------------
 *  - Strings IN  : caller-owned, UTF-8, null-terminated.
 *  - Strings OUT : heap-allocated by Rust; caller must free with
 *                  taladb_free_string().
 *  - Handles     : allocated by taladb_open(); freed by taladb_close().
 *  - Errors      : string functions return NULL; integer functions return -1,
 *                  with detail available from taladb_last_error().
 */
"""

# NOTE: do not set `[export] prefix`. It prefixes *type* names, not symbols —
# the FFI functions are already `taladb_`-prefixed by their Rust names — so it
# renames `TalaDbHandle` to `taladbTalaDbHandle` and desynchronises the header
# from the C++ that includes it.

[parse]
parse_deps = false
