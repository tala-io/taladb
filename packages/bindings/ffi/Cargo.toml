[package]
name = "taladb-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "TalaDB C FFI — the stable C interface used by the React Native, Swift and Kotlin bindings"
# Not published: crates.io carries only the `taladb` crate (packages/core).
# This crate is built and shipped through its own channel.
publish = false

[lints]
workspace = true

[lib]
name = "taladb_ffi"
# staticlib  → linked into iOS .app (lipo'd universal .a)
# cdylib     → loaded by Android as libtaladb_ffi.so
# rlib       → so Rust tooling can depend on this crate. Only the fuzz targets do
#              (see the `fuzzing` feature); shipping builds ignore the extra
#              artifact. Without it the JSON→Filter parsers here are unreachable
#              from a fuzzer, which is where the nesting and operator handling
#              actually live.
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Exposes the internal JSON parsers so `packages/core/fuzz` can drive them.
# Off by default, so the shipped library's surface is unchanged.
fuzzing = []

[dependencies]
taladb-core = { package = "taladb", path = "../../core", default-features = false, features = ["encryption", "legacy-migration", "vector-hnsw"] }
serde_json   = "1.0"

[dev-dependencies]
tempfile = "3.10"
