[package]
name = "taladb-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "TalaDB Node.js native module (napi-rs)"
# Not published: crates.io carries only the `taladb` crate (packages/core).
# This crate is built and shipped through its own channel.
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
taladb-core = { package = "taladb", path = "../../core", features = ["vector-hnsw", "encryption"] }
napi = { version = "2.16", features = ["async", "serde-json"] }
napi-derive = "2.16"
serde_json = "1.0"
tokio = { version = "1.28", features = ["full"] }

[build-dependencies]
napi-build = "2.1"
