name: Vector performance

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'packages/core/**'
      - 'scripts/vector-bench-ci.py'
      - 'scripts/bench-web/**'
      - 'scripts/bench-web.mjs'
      - 'scripts/vector-web-bench-compare.mjs'
      - 'packages/bindings/web/**'
      - '.github/workflows/performance.yml'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: vector-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        # x64 and arm64: an x64-only benchmark hides vectorisation losses that
        # hit aarch64 (and phones) hard — see the 2026-09-20 cosine regression.
        os: [ubuntu-latest, ubuntu-24.04-arm]
        quantization: [none, binary]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The arm64 runner image is not guaranteed to ship rustup the way the x64
      # one does; install it when missing, then let rust-toolchain.toml pin it.
      - name: Sync pinned toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Prepare baseline
        id: baseline
        env:
          BENCH_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            BENCH_BASE=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD^)
          fi
          if ! git cat-file -e "$BENCH_BASE^{commit}" 2>/dev/null; then
            BENCH_BASE=HEAD^
          fi
          git worktree add --detach "$RUNNER_TEMP/vector-baseline" "$BENCH_BASE"
          # The baseline compiles the candidate's harnesses, which set cache
          # budgets. Re-runs keep the original event's base, which can predate them.
          if grep -q 'pub fn set_vector_cache_budget' "$RUNNER_TEMP/vector-baseline/packages/core/src/lib.rs"; then
            echo "compatible=true" >> "$GITHUB_OUTPUT"
          else
            echo "compatible=false" >> "$GITHUB_OUTPUT"
            echo "Baseline $BENCH_BASE predates configurable cache budgets; skipped native comparisons." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compare release workloads
        if: steps.baseline.outputs.compatible == 'true'
        env:
          BENCH_EVENT: ${{ github.event_name }}
          BENCH_QUANTIZATION: ${{ matrix.quantization }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          count=2000
          repeats=3
          if [ "$BENCH_EVENT" != pull_request ]; then
            count=10000
            repeats=1
          fi
          python scripts/vector-bench-ci.py "$RUNNER_TEMP/vector-baseline" "$GITHUB_WORKSPACE" \
            --count "$count" --repeats "$repeats" --quantization "$BENCH_QUANTIZATION" --output vector-benchmark.json
      - name: Compare resumable builds
        if: steps.baseline.outputs.compatible == 'true'
        env:
          BENCH_EVENT: ${{ github.event_name }}
          BENCH_QUANTIZATION: ${{ matrix.quantization }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          count=2000
          repeats=3
          if [ "$BENCH_EVENT" != pull_request ]; then
            count=10000
            repeats=1
          fi
          python scripts/vector-bench-ci.py "$RUNNER_TEMP/vector-baseline" "$GITHUB_WORKSPACE" \
            --count "$count" --repeats "$repeats" --quantization "$BENCH_QUANTIZATION" \
            --batch-size 128 --output vector-benchmark-staged.json
      - name: Compare filtered workloads
        if: matrix.quantization == 'none' && steps.baseline.outputs.compatible == 'true'
        env:
          BENCH_EVENT: ${{ github.event_name }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          count=2000
          repeats=3
          if [ "$BENCH_EVENT" != pull_request ]; then
            count=10000
            repeats=1
          fi
          python scripts/vector-bench-ci.py "$RUNNER_TEMP/vector-baseline" "$GITHUB_WORKSPACE" \
            --workload filtered --count "$count" --repeats "$repeats" --queries 20 \
            --output vector-benchmark-filtered.json
      - name: Check concurrent search memory at phone budgets
        if: matrix.quantization == 'none'
        run: |
          for budget in 1048576 8388608; do
            cargo run --locked --release -p taladb --example vector_memory_profile -- \
              --cache-bytes "$budget" --count 2000 --queries 20 > "vector-memory-$budget.json"
          done
      - name: Publish benchmark history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-benchmark-${{ runner.os }}-${{ runner.arch }}-${{ matrix.quantization }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            vector-benchmark.json
            vector-benchmark-staged.json
            vector-benchmark-filtered.json
            vector-memory-*.json
          retention-days: 90

  browser:
    name: Browser worker + OPFS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: vector-web
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Prepare baseline
        env:
          BENCH_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            BENCH_BASE=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD^)
          fi
          if ! git cat-file -e "$BENCH_BASE^{commit}" 2>/dev/null; then
            BENCH_BASE=HEAD^
          fi
          git worktree add --detach "$RUNNER_TEMP/vector-web-baseline" "$BENCH_BASE"
      - name: Build both browser bindings
        run: |
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/vector-web-baseline" \
            wasm-pack build "$RUNNER_TEMP/vector-web-baseline/packages/bindings/web" --target web --out-dir pkg --release
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/vector-web-candidate" \
            wasm-pack build packages/bindings/web --target web --out-dir pkg --release
      - name: Check browser harness
        run: node scripts/bench-web/vector-workload.test.mjs
      - name: Compare small-device cache profiles
        env:
          BENCH_EVENT: ${{ github.event_name }}
        run: |
          count=2000
          repeats=3
          if [ "$BENCH_EVENT" != pull_request ]; then count=5000; repeats=1; fi
          failed=0
          budgets="8388608"
          if grep -q 'pub vector_cache_bytes:' "$RUNNER_TEMP/vector-web-baseline/packages/core/src/config.rs"; then
            budgets="1048576 8388608"
          else
            echo "Baseline predates configurable cache budgets; comparing its 8 MiB WASM default." >> "$GITHUB_STEP_SUMMARY"
          fi
          for budget in $budgets; do
            before=""
            after=""
            for run in $(seq 1 "$repeats"); do
              node scripts/bench-web.mjs --vectors --repo "$RUNNER_TEMP/vector-web-baseline" \
                --count "$count" --queries 30 --cache-bytes "$budget" --json --output "vector-web-before-$budget-$run.json"
              node scripts/bench-web.mjs --vectors --count "$count" --queries 30 \
                --cache-bytes "$budget" --json --output "vector-web-after-$budget-$run.json"
              before="${before:+$before,}vector-web-before-$budget-$run.json"
              after="${after:+$after,}vector-web-after-$budget-$run.json"
            done
            node scripts/vector-web-bench-compare.mjs "$before" "$after" \
              "vector-web-comparison-$budget.json" || failed=1
          done
          exit "$failed"
      - name: Publish browser benchmark history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-web-${{ github.sha }}-${{ github.run_attempt }}
          path: vector-web-*.json
          retention-days: 90
