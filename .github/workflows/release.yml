name: Release

on:
  push:
    tags:
      - "v*" # v0.1.0, v1.2.3-beta.1, etc.
    branches:
      - main # allowed to push tags from main only (enforced below)

# Only run when a version tag is pushed.
# The `if:` on the build jobs ensures nothing runs on plain `main` pushes.

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Guard — only proceed when triggered by a v* tag on main
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight — validate tag & branch
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag points to a commit on main
        run: |
          TAG_SHA=$(git rev-list -n1 "${{ github.ref_name }}")
          MAIN_SHA=$(git rev-parse origin/main)
          MERGED=$(git merge-base --is-ancestor "$TAG_SHA" "$MAIN_SHA" && echo yes || echo no)
          if [ "$MERGED" != "yes" ]; then
            echo "Tag ${{ github.ref_name }} does not point to a commit on main. Aborting."
            exit 1
          fi
          echo "Tag is on main — proceeding."

      - name: Parse version from tag
        id: parse
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

  # ---------------------------------------------------------------------------
  # Full CI gate — re-run all checks at the exact tagged commit
  # ---------------------------------------------------------------------------
  rust-check:
    name: Rust — check / clippy / test
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` decides the version; rustup honours it ahead of any
      # default. Targets are added with `rustup target add` rather than the
      # toolchain action's `targets:` input, because that input installs them for
      # the toolchain *the action* resolves — which stops being the active one the
      # moment `stable` moves past the pin, and the build then fails looking for a
      # std it never installed.
      - name: Sync pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - run: cargo check --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # TypeScript type-check
  # ---------------------------------------------------------------------------
  ts-check:
    name: TypeScript — type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: tsc --noEmit (taladb)
        run: node_modules/.bin/tsc -p packages/clients/taladb/tsconfig.json --noEmit

      - name: tsc --noEmit (@taladb/react)
        run: node_modules/.bin/tsc -p packages/clients/react/tsconfig.json --noEmit


  # ---------------------------------------------------------------------------
  # Build WASM
  # ---------------------------------------------------------------------------
  build-wasm:
    name: Build — WASM
    runs-on: ubuntu-latest
    needs: [rust-check, ts-check]

    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` decides the version; rustup honours it ahead of any
      # default. Targets are added with `rustup target add` rather than the
      # toolchain action's `targets:` input, because that input installs them for
      # the toolchain *the action* resolves — which stops being the active one the
      # moment `stable` moves past the pin, and the build then fails looking for a
      # std it never installed.
      - name: Sync pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add build targets
        run: rustup target add wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-rel-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-rel-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build packages/bindings/web --target web --out-dir pkg --release

      - name: Archive WASM pkg
        run: tar -czf taladb-web-${{ needs.preflight.outputs.version }}.tar.gz -C packages/bindings/web/pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: release-wasm
          path: taladb-web-${{ needs.preflight.outputs.version }}.tar.gz

  # ---------------------------------------------------------------------------
  # Build Node.js native module (linux / macos / windows)
  # ---------------------------------------------------------------------------
  build-node:
    name: Build — Node.js (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: rust-check

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: taladb-node-linux
          - os: macos-latest
            artifact: taladb-node-macos
          - os: windows-latest
            artifact: taladb-node-windows

    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` decides the version; rustup honours it ahead of any
      # default. Targets are added with `rustup target add` rather than the
      # toolchain action's `targets:` input, because that input installs them for
      # the toolchain *the action* resolves — which stops being the active one the
      # moment `stable` moves past the pin, and the build then fails looking for a
      # std it never installed.
      - name: Sync pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-node-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-node-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build native module
        working-directory: packages/bindings/node
        run: pnpm build

      - name: Upload native module
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/bindings/node/*.node

  # ---------------------------------------------------------------------------
  # Build CLI binary (linux / macos / windows)
  # ---------------------------------------------------------------------------
  build-cli:
    name: Build — CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [rust-check, ts-check]

    strategy:
      fail-fast: false
      matrix:
        # Asset names carry the Rust target triple and **no version**, so that
        # `releases/latest/download/taladb-<triple>.tar.gz` resolves — that URL
        # is what makes the one-line installer work without the caller knowing
        # which release is current.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: taladb-x86_64-unknown-linux-gnu
            bin: taladb
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: taladb-aarch64-apple-darwin
            bin: taladb
          # GitHub retired the Intel `macos-13` runners, so the x86_64 slice is
          # cross-compiled from the Apple-silicon runner instead.
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: taladb-x86_64-apple-darwin
            bin: taladb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: taladb-x86_64-pc-windows-msvc
            bin: taladb.exe

    steps:
      - uses: actions/checkout@v4
      # `rust-toolchain.toml` decides the version; rustup honours it ahead of any
      # default. Targets are added with `rustup target add` rather than the
      # toolchain action's `targets:` input, because that input installs them for
      # the toolchain *the action* resolves — which stops being the active one the
      # moment `stable` moves past the pin, and the build then fails looking for a
      # std it never installed.
      - name: Sync pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add build targets
        run: rustup target add ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-cli-rel-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-cli-rel-

      - name: Build CLI
        run: cargo build -p taladb-cli --release --target ${{ matrix.target }}

      - name: Compress binary (unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.artifact }}.tar.gz \
            -C target/${{ matrix.target }}/release ${{ matrix.bin }}

      - name: Compress binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.bin }} `
            -DestinationPath ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  # ---------------------------------------------------------------------------
  # Build React Native iOS static library (universal arm64 + x86_64)
  # ---------------------------------------------------------------------------
  build-rn-ios:
    name: Build — React Native iOS
    runs-on: macos-latest
    needs: [rust-check, ts-check]

    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` decides the version; rustup honours it ahead of any
      # default. Targets are added with `rustup target add` rather than the
      # toolchain action's `targets:` input, because that input installs them for
      # the toolchain *the action* resolves — which stops being the active one the
      # moment `stable` moves past the pin, and the build then fails looking for a
      # std it never installed.
      - name: Sync pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add build targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rn-ios-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-rn-ios-

      - name: Build iOS targets
        working-directory: packages/bindings/ffi
        run: |
          cargo build --release --target aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios-sim
          cargo build --release --target x86_64-apple-ios

      - name: Create simulator fat library and xcframework
        run: |
          # Merge Apple Silicon + Intel simulator slices into one sim fat lib
          lipo -create \
            target/aarch64-apple-ios-sim/release/libtaladb_ffi.a \
            target/x86_64-apple-ios/release/libtaladb_ffi.a \
            -output /tmp/libtaladb_ffi_sim.a

          # Build XCFramework (device slice + universal simulator slice)
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libtaladb_ffi.a \
            -headers packages/bindings/react-native/cpp \
            -library /tmp/libtaladb_ffi_sim.a \
            -headers packages/bindings/react-native/cpp \
            -output packages/bindings/react-native/ios/TalaDBFfi.xcframework

      - uses: actions/upload-artifact@v4
        with:
          name: release-rn-ios
          path: packages/bindings/react-native/ios/TalaDBFfi.xcframework

  # ---------------------------------------------------------------------------
  # Build React Native Android shared libraries (arm64-v8a, armeabi-v7a, x86_64)
  # ---------------------------------------------------------------------------
  build-rn-android:
    name: Build — React Native Android
    runs-on: ubuntu-latest
    needs: [rust-check, ts-check]

    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` decides the version; rustup honours it ahead of any
      # default. Targets are added with `rustup target add` rather than the
      # toolchain action's `targets:` input, because that input installs them for
      # the toolchain *the action* resolves — which stops being the active one the
      # moment `stable` moves past the pin, and the build then fails looking for a
      # std it never installed.
      - name: Sync pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add build targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Cache cargo registry, build, and cargo-ndk binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            target
          key: ${{ runner.os }}-cargo-rn-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-rn-android-

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.2.12479018"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --force

      - name: Build Android targets
        working-directory: packages/bindings/ffi
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../react-native/android/src/main/jniLibs \
            build --release

      # Google Play rejects apps whose 64-bit libraries are not 16 KB aligned,
      # and a 16 KB-page device cannot load them at all. The flag lives in
      # .cargo/config.toml; this proves it reached the linker, because a
      # RUSTFLAGS override or a cargo-ndk change would drop it silently.
      - name: libtaladb_ffi.so is 16 KB page aligned
        run: |
          set -euo pipefail
          for so in packages/bindings/react-native/android/src/main/jniLibs/*/libtaladb_ffi.so; do
            aligns="$(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }')"
            echo "$so: $(echo $aligns)"
            for a in $aligns; do
              if (( a < 0x4000 )); then
                echo "::error::$so has a LOAD segment aligned to $a; expected >= 0x4000"
                exit 1
              fi
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-rn-android
          path: packages/bindings/react-native/android/src/main/jniLibs/

      # The same libraries, packaged for the native Kotlin package
      # (tala-io/taladb-kotlin), which downloads this archive from the GitHub
      # release and verifies it against the published SHA-256. The header
      # travels with the binaries so the JNI shim is always compiled against
      # the exact interface the library exports.
      - name: Package native Android archive
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="$RUNNER_TEMP/taladb-ffi-android-$VERSION"
          mkdir -p "$STAGE/include"
          cp -R packages/bindings/react-native/android/src/main/jniLibs "$STAGE/jniLibs"
          cp packages/bindings/ffi/include/taladb.h "$STAGE/include/"
          cp LICENSE-MIT LICENSE-APACHE "$STAGE/"
          mkdir -p dist-native
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/dist-native/taladb-ffi-android-$VERSION.zip" "taladb-ffi-android-$VERSION")
          (cd dist-native && sha256sum "taladb-ffi-android-$VERSION.zip" > "taladb-ffi-android-$VERSION.zip.sha256")
          cat dist-native/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: native-android
          path: dist-native/

  # ---------------------------------------------------------------------------
  # Build — taladb TypeScript package (tsup)
  # ---------------------------------------------------------------------------
  build-taladb:
    name: Build — taladb (TS)
    runs-on: ubuntu-latest
    needs: [rust-check, ts-check]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Build
        working-directory: packages/clients/taladb
        run: |
          pnpm exec tsup
          ls dist/index.mjs dist/index.js dist/index.d.ts dist/index.react-native.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: release-taladb
          path: packages/clients/taladb/dist/

  # ---------------------------------------------------------------------------
  # Build — @taladb/react hooks package (tsup)
  # ---------------------------------------------------------------------------
  build-taladb-react:
    name: Build — @taladb/react (TS)
    runs-on: ubuntu-latest
    needs: [rust-check, ts-check]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Build
        working-directory: packages/clients/react
        run: |
          pnpm exec tsup
          ls dist/index.mjs dist/index.js dist/index.d.ts

      - uses: actions/upload-artifact@v4
        with:
          name: release-taladb-react
          path: packages/clients/react/dist/

  # ---------------------------------------------------------------------------
  # Publish npm packages
  # Publishes: taladb, @taladb/web, @taladb/node, @taladb/react-native, @taladb/react
  # ---------------------------------------------------------------------------
  publish-npm:
    name: Publish — npm
    runs-on: ubuntu-latest
    needs:
      [
        build-wasm,
        build-node,
        build-cli,
        build-rn-ios,
        build-rn-android,
        build-taladb,
        build-taladb-react,
      ]
    # To require manual approval before publishing, create an environment named
    # "npm-publish" in Settings → Environments and enable required reviewers.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install

      # -- @taladb/web ---------------------------------------------------------
      - name: Download WASM pkg
        uses: actions/download-artifact@v4
        with:
          name: release-wasm
          path: /tmp/wasm-artifact

      - name: Extract WASM pkg into package
        run: |
          mkdir -p packages/bindings/web/pkg
          tar -xzf /tmp/wasm-artifact/*.tar.gz -C packages/bindings/web/pkg
          # wasm-pack generates pkg/.gitignore containing `*`, which npm-packlist
          # honours — silently excluding the whole pkg/ directory during publish.
          # Remove it so the files field in package.json is the only authority.
          # `pnpm build` does this too, so a local pack matches what CI ships.
          rm -f packages/bindings/web/pkg/.gitignore

      - name: Publish @taladb/web
        working-directory: packages/bindings/web
        run: pnpm publish --no-git-checks --access public || echo 'Already published, skipping'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # -- @taladb/node --------------------------------------------------------
      - name: Download Node.js binaries (linux)
        uses: actions/download-artifact@v4
        with:
          name: taladb-node-linux
          path: packages/bindings/node

      - name: Download Node.js binaries (macos)
        uses: actions/download-artifact@v4
        with:
          name: taladb-node-macos
          path: packages/bindings/node

      - name: Download Node.js binaries (windows)
        uses: actions/download-artifact@v4
        with:
          name: taladb-node-windows
          path: packages/bindings/node

      - name: Publish @taladb/node
        working-directory: packages/bindings/node
        run: pnpm publish --no-git-checks --access public || echo 'Already published, skipping'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # -- @taladb/react-native ------------------------------------------------
      - name: Download React Native iOS xcframework
        uses: actions/download-artifact@v4
        with:
          name: release-rn-ios
          path: packages/bindings/react-native/ios/TalaDBFfi.xcframework

      - name: Download React Native Android libraries
        uses: actions/download-artifact@v4
        with:
          name: release-rn-android
          path: packages/bindings/react-native/android/src/main/jniLibs

      - name: Publish @taladb/react-native
        working-directory: packages/bindings/react-native
        run: pnpm publish --no-git-checks --access public || echo 'Already published, skipping'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # -- @taladb/react -------------------------------------------------------
      - name: Download @taladb/react dist
        uses: actions/download-artifact@v4
        with:
          name: release-taladb-react
          path: packages/clients/react/dist

      - name: Publish @taladb/react
        working-directory: packages/clients/react
        run: pnpm publish --no-git-checks --access public || echo 'Already published, skipping'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # -- taladb (TS wrapper) -------------------------------------------------
      - name: Download taladb dist
        uses: actions/download-artifact@v4
        with:
          name: release-taladb
          path: packages/clients/taladb/dist

      - name: Inspect pack contents
        working-directory: packages/clients/taladb
        run: npm pack --dry-run

      # `pnpm publish`, not `npm publish`: this package declares its bindings as
      # `workspace:*` peers, and only pnpm rewrites that protocol to a real
      # version on publish. npm ships it verbatim — taladb@0.9.3 went out with
      # `"@taladb/web": "workspace:*"` in peerDependencies, which no consumer
      # can resolve.
      - name: Publish taladb
        working-directory: packages/clients/taladb
        run: pnpm publish --no-git-checks --access public || echo 'Already published, skipping'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---------------------------------------------------------------------------
  # GitHub Release — create release and attach all binaries
  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-npm, build-rn-android]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The GitHub release carries what has no npm channel: the CLI, and the
      # native library archive the Kotlin package (tala-io/taladb-kotlin)
      # downloads. The npm packages (@taladb/node, @taladb/web,
      # @taladb/react-native) embed their own binaries, so their wasm, xcframework
      # and jniLibs artifacts are not attached — they would be loose duplicates.
      #
      # `release-taladb-*-*` selects exactly the platform CLI builds
      # (release-taladb-x86_64-unknown-linux-gnu, -aarch64-apple-darwin,
      # -x86_64-apple-darwin, -x86_64-pc-windows-msvc) and excludes
      # release-taladb / release-taladb-react, which have no second dash. The
      # @taladb/node binaries are uploaded unprefixed (taladb-node-*), so they
      # do not match either. Each CLI archive has a unique, triple-suffixed
      # name, so merge-multiple is collision-free.
      - name: Download CLI archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-taladb-*-*
          path: /tmp/release-assets
          merge-multiple: true

      - name: Download native Android archive
        uses: actions/download-artifact@v4
        with:
          name: native-android
          path: /tmp/release-assets

      # Published as a release asset so the documented one-liner —
      # releases/latest/download/install.sh — resolves without a version.
      - name: Stage installer
        run: cp install.sh /tmp/release-assets/install.sh

      - name: List assets
        run: ls -lh /tmp/release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TalaDB ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }} # v1.0.0-beta.1 → pre-release
          generate_release_notes: true
          files: /tmp/release-assets/*

  # ---------------------------------------------------------------------------
  # Notify the native package repositories
  # ---------------------------------------------------------------------------
  # The Kotlin package lives in its own repository and pins an engine release by
  # URL and SHA-256. This tells it a new archive exists; a workflow there opens
  # the bump PR and runs its tests against it, so a release that breaks the
  # wrapper is caught there rather than by its users.
  #
  # Needs NATIVE_PACKAGES_DISPATCH_TOKEN — a fine-grained token with
  # Contents: write on tala-io/taladb-kotlin. Skipped, not failed, while the
  # secret is unset, so a release never blocks on it.
  notify-native-packages:
    name: Notify native packages
    runs-on: ubuntu-latest
    needs: [github-release]
    env:
      DISPATCH_TOKEN: ${{ secrets.NATIVE_PACKAGES_DISPATCH_TOKEN }}

    steps:
      - name: Dispatch taladb-release to tala-io/taladb-kotlin
        if: env.DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.NATIVE_PACKAGES_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="taladb-ffi-android-$VERSION.zip"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          SHA256="$(curl -fsSL "$BASE/$ASSET.sha256" | cut -d' ' -f1)"
          gh api repos/tala-io/taladb-kotlin/dispatches \
            -f event_type=taladb-release \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[url]=$BASE/$ASSET" \
            -f "client_payload[sha256]=$SHA256"
