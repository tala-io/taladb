[workspace]
resolver = "2"
members = [
    "packages/core",
    "packages/bindings/web",
    "packages/bindings/node",
    "packages/tools/cli",
    "packages/bindings/react-native/rust",
]

[workspace.package]
version = "0.11.8"
edition = "2024"
authors = ["taladb"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tala-sh/taladb"
homepage = "https://github.com/tala-sh/taladb"
# Two things set this floor, and the higher one wins:
#
#   1.88  let-chains (`if let … && let …`) in edition 2024, which the query and
#         collection paths use throughout.
#   1.90  redb 4.2, which declares it. redb 4 is not optional — it is the only
#         way onto the current on-disk format, and there is no 4.x below 1.89
#         (4.0 and 4.1 want 1.89, 4.2 wants 1.90).
#
# Raised from 1.88 deliberately when adopting redb 4: this IS a breaking change
# for downstream users, and the only way to avoid it would be to stay on redb 2.
# Pinning redb to 4.1 would buy back exactly one release (1.89) and is not worth
# holding the storage engine a version behind.
rust-version = "1.90"

# Lints are declared once here and inherited by every crate via
# `[lints] workspace = true`, so a rule can't drift between the core engine and
# the bindings. Only lints the tree is currently clean under are listed: a lint
# that fires on existing code is a lint people learn to ignore.
[workspace.lints.rust]
# An `unsafe fn` body is not implicitly an unsafe block. Denying this is what
# forces the React Native FFI to mark each pointer dereference at its call site
# rather than inheriting a blanket exemption from the function signature.
unsafe_op_in_unsafe_fn = "deny"
# NOTE: `unreachable_pub` is deliberately absent. `#[wasm_bindgen]` requires the
# functions it exports to be literally `pub`, but they are not reachable through
# the crate root, so the lint fires on every binding and its suggested fix
# (`pub(crate)`) is code wasm-bindgen refuses to compile.

[workspace.lints.clippy]
uninlined_format_args = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
use_self = "warn"
# Numeric conversions that can silently truncate. `cast_possible_truncation` is
# deliberately *not* enabled: ~100 of the casts here are provably in range and
# annotating each would bury the handful that aren't. The ones that mattered —
# `u64` skip/limit values narrowed to `usize` on 32-bit wasm — now go through
# `usize::try_from`.
cast_lossless = "warn"

[profile.release]
opt-level = 3
lto = true
# One codegen unit lets LTO see the whole crate graph: better inlining across
# the storage/query boundary, and a smaller wasm binary.
codegen-units = 1
# Overflow wraps silently in release by default, so the same expression has two
# behaviours: a panic in `cargo test` and a wrong answer in the shipped build.
# For a database whose sizes, offsets and `top_k` values all arrive from a
# caller, the wrong answer is worse — an overflowed candidate pool returns a
# plausible, under-recalled result set with nothing in the logs. Keeping checks
# on makes the two builds agree.
#
# Measured cost on the payload where size matters most: the release wasm bundle
# goes from 1526.7 KB to 1544.7 KB, so +18 KB / +1.18%. Worth it — that is well
# under the noise of one extra dependency, and it buys the guarantee that a
# release build cannot silently compute a wrong length or offset.
overflow-checks = true

# NOTE: there is deliberately no `release-wasm` profile. `wasm-pack build
# --release` uses `[profile.release]` and cannot be pointed at a custom one, so
# a size-tuned profile here would silently never run — which is exactly what
# happened to the `opt-level = "z"` profile this replaces. WASM size is instead
# controlled by the `wasm-opt` flags in
# `packages/bindings/web/Cargo.toml` under
# `[package.metadata.wasm-pack.profile.release]`, which wasm-pack does honour.

# Benchmarks inherit `release` optimisation but keep debug symbols, so a profile
# shows real function names instead of a wall of inlined addresses.
[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = true
